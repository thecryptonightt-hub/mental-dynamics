name: Rename staging homepage to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move staging index.html into place
        run: |
          test -f staging/index.html
          test "$(stat -c%s staging/index.html)" = "1545451"
          grep -q "Fall Asleep Anywhere, Anytime" staging/index.html
          mv -f staging/index.html index.html
          rmdir staging
          git config user.name "thecryptonightt-hub"
          git config user.email "thecryptonightt-hub@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add free sleep technique section + audio"
          git push
